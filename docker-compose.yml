services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyramide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pyramide}
    ports:
      # Bound to loopback only — lets you `psql`/pgAdmin from the host for
      # debugging without exposing Postgres to the network. Host port is
      # 5433 (not 5432) to avoid clashing with any other local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pyramide}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyramide}
    ports:
      # Loopback-only, same rationale as postgres's 5433 above: lets you hit
      # the app directly (plain HTTP, no Caddy/HTTPS/self-signed cert) for
      # local debugging without exposing it to the network. Caddy on 80/443
      # remains the only externally reachable entry point.
      - "127.0.0.1:3000:3000"
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Also runs migrate.js first, same as the app service's default CMD:
    # `depends_on: postgres healthy` only means Postgres itself is up, not
    # that the schema exists yet, and app/worker start in parallel — without
    # this, a fresh `docker compose up` has the worker hitting
    # "relation does not exist" until app's migration finishes (found by
    # actually running a clean `docker compose up` end to end). migrate.js
    # is idempotent, so running it from both containers on startup is safe.
    command: ["sh", "-c", "node dist-server/migrate.js && node dist-server/worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pyramide}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyramide}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  internal:
  web:

volumes:
  pg_data:
  caddy_data:
  caddy_config:
